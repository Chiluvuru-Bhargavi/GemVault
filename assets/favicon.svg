<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="vaultGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5E6AD2"/>
      <stop offset="50%" stop-color="#27A644"/>
      <stop offset="100%" stop-color="#191A1B"/>
    </linearGradient>
    <linearGradient id="facetGrad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#828FFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F1011" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="vaultGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer Shield / Vault Shape -->
  <path d="M32 4L54 14V34C54 46.5 44.5 57 32 60C19.5 57 10 46.5 10 34V14L32 4Z" 
        fill="#08090A" stroke="#5E6AD2" stroke-width="2" stroke-linejoin="round"/>
  <!-- Inner Facets (Obsidian Gem) -->
  <path d="M32 10L48 18V33C48 42.5 41 50.8 32 53.5C23 50.8 16 42.5 16 33V18L32 10Z" 
        fill="url(#facetGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  <!-- Central Gemstone Polygon -->
  <polygon points="32,16 44,24 38,42 32,48 26,42 20,24" 
           fill="#0F1011" stroke="#27A644" stroke-width="1.5" filter="url(#vaultGlow)"/>
  <polygon points="32,16 38,28 32,36 26,28" 
           fill="#5E6AD2" fill-opacity="0.4" stroke="#828FFF" stroke-width="1"/>
  <!-- Core Monotonic Dot -->
  <circle cx="32" cy="31" r="2.5" fill="#27A644"/>
</svg>
